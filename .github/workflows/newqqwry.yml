name: Download and Update Czip Db File
on:
  workflow_dispatch:
  schedule:
    - cron: '10 2,5,9,12,15 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build qqwry.dat
        env:
          DOWNLOAD_TOKEN: ${{ secrets.DOWNLOAD_TOKEN }}
          CZDB_TOKEN: ${{ secrets.CZDB_TOKEN }}
        run: pnpm run build

      - name: Check version and prepare release
        id: version_check
        run: |
          dat_date=$(cat version)
          echo "dat_date=${dat_date}" >> $GITHUB_ENV
          echo "version=${dat_date}" >> $GITHUB_OUTPUT
          
          git fetch --tags
          if git rev-parse ${dat_date} >/dev/null 2>&1; then
            echo "Tag ${dat_date} already exists, skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New version ${dat_date} detected"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Calculate file hash
        if: steps.version_check.outputs.skip != 'true'
        id: hash
        run: |
          FILE_HASH=$(sha256sum ./dist/qqwry.dat | awk '{ print $1 }')
          echo "file_hash=${FILE_HASH}" >> $GITHUB_OUTPUT
          echo "FILE_HASH=${FILE_HASH}" >> $GITHUB_ENV

      - name: Create Release
        if: steps.version_check.outputs.skip != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version_check.outputs.version }}
          name: Release ${{ steps.version_check.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ./dist/qqwry.dat
          body: |
            ## 纯真 IP 库更新 🎉
            
            ### 📦 文件信息
            
            | 项目 | 内容 |
            | :---: | :--- |
            | 📅 版本号 | `${{ steps.version_check.outputs.version }}` |
            | 🔐 SHA256 | `${{ steps.hash.outputs.file_hash }}` |
            | 📥 快速下载 | [qqwry.dat](https://raw.gitmirror.com/nmgliangwei/qqwry/main/qqwry.dat) |
            | 📊 GitHub Release | [下载附件](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_check.outputs.version }}/qqwry.dat) |
            
            ### 🚀 使用方法
            
            ```bash
            # 使用 wget 下载
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version_check.outputs.version }}/qqwry.dat
            
            # 或使用 curl 下载
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version_check.outputs.version }}/qqwry.dat
            ```

      - name: Commit and push changes
        if: steps.version_check.outputs.skip != 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          mv ./dist/qqwry.dat qqwry.dat
          git add qqwry.dat version version.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Update qqwry.dat to version ${{ steps.version_check.outputs.version }}"
            git push
          fi